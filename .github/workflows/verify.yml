name: Verify AINA
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aina-web/package-lock.json
      - run: npm run setup
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: aina-static-site
          path: aina-web/dist
